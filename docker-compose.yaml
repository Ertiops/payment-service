x-application: &application
  image: payment-service:local
  build:
    context: .
  restart: on-failure:5

x-application-env: &application-env
  APP_DEBUG: ${APP_DEBUG:-False}
  APP_DB_DSN: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
  APP_X_API_KEY: ${APP_X_API_KEY:-secret}

services:
  db:
    image: postgres:16
    restart: on-failure:5
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: on-failure:5
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  api:
    <<: *application
    command: python -m app api
    ports:
      - "127.0.0.1:${APP_REST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *application-env
      APP_REST_HOST: 0.0.0.0
      APP_REST_PORT: 8000

  worker:
    <<: *application
    command: python -m app worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *application-env
      APP_RABBITMQ_DSN: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
      APP_OUTBOX_POLL_INTERVAL: ${APP_OUTBOX_POLL_INTERVAL:-1}
      APP_OUTBOX_INITIAL_DELAY_SECONDS: ${APP_OUTBOX_INITIAL_DELAY_SECONDS:-1}
      APP_OUTBOX_MAX_DELAY_SECONDS: ${APP_OUTBOX_MAX_DELAY_SECONDS:-30}
      APP_RETRY_INITIAL_DELAY_SECONDS: ${APP_RETRY_INITIAL_DELAY_SECONDS:-1}
      APP_PROCESSING_LEASE_SECONDS: ${APP_PROCESSING_LEASE_SECONDS:-30}
      APP_GATEWAY_TIMEOUT_SECONDS: ${APP_GATEWAY_TIMEOUT_SECONDS:-10}
      APP_PAYMENT_GATEWAY_MIN_DELAY_SECONDS: ${APP_PAYMENT_GATEWAY_MIN_DELAY_SECONDS:-2}
      APP_PAYMENT_GATEWAY_MAX_DELAY_SECONDS: ${APP_PAYMENT_GATEWAY_MAX_DELAY_SECONDS:-5}
      APP_PAYMENT_GATEWAY_SUCCESS_RATE: ${APP_PAYMENT_GATEWAY_SUCCESS_RATE:-0.9}
      APP_WEBHOOK_TIMEOUT_SECONDS: ${APP_WEBHOOK_TIMEOUT_SECONDS:-5}
      APP_WEBHOOK_BASE_URL: ${APP_WEBHOOK_BASE_URL:-http://webhook.site}

volumes:
  postgres_data:
  rabbitmq_data:
