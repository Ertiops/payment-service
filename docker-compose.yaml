services:
  db:
    image: postgres:16
    restart: on-failure:5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    restart: on-failure:5
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  app:
    build:
      context: .
    restart: on-failure:5
    command: python -m app
    ports:
      - "${APP_REST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_TITLE: ${APP_TITLE:-Payment Service}
      APP_DESCRIPTION: ${APP_DESCRIPTION:-Python REST Payment Service}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_DEBUG: ${APP_DEBUG:-False}
      APP_REST_HOST: 0.0.0.0
      APP_REST_PORT: 8000
      APP_X_API_KEY: ${APP_X_API_KEY:-secret}
      APP_DB_DSN: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      APP_DB_POOL_SIZE: ${APP_DB_POOL_SIZE:-10}
      APP_DB_POOL_TIMEOUT: ${APP_DB_POOL_TIMEOUT:-10}
      APP_RABBITMQ_DSN: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
      APP_OUTBOX_POLL_INTERVAL: ${APP_OUTBOX_POLL_INTERVAL:-1}
      APP_OUTBOX_MAX_ATTEMPTS: ${APP_OUTBOX_MAX_ATTEMPTS:-3}
      APP_PAYMENT_GATEWAY_MIN_DELAY_SECONDS: ${APP_PAYMENT_GATEWAY_MIN_DELAY_SECONDS:-2}
      APP_PAYMENT_GATEWAY_MAX_DELAY_SECONDS: ${APP_PAYMENT_GATEWAY_MAX_DELAY_SECONDS:-5}
      APP_PAYMENT_GATEWAY_SUCCESS_RATE: ${APP_PAYMENT_GATEWAY_SUCCESS_RATE:-0.9}
      APP_WEBHOOK_TIMEOUT_SECONDS: ${APP_WEBHOOK_TIMEOUT_SECONDS:-5}
      APP_WEBHOOK_MAX_ATTEMPTS: ${APP_WEBHOOK_MAX_ATTEMPTS:-3}
      APP_WEBHOOK_INITIAL_DELAY_SECONDS: ${APP_WEBHOOK_INITIAL_DELAY_SECONDS:-1}
      APP_WEBHOOK_BASE_URL: ${APP_WEBHOOK_BASE_URL:-http://webhook.site}

volumes:
  postgres_data:
  rabbitmq_data:
